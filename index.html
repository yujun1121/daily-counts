<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>忍住不要工作之忍不住也要忍</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#f6f3ee; --card:#fff; --ink:#2c2a26; --sub:#8a847a; --line:#ece7df;
    --accent:#3a9d8e; --accent-soft:#e3f1ee; --radius:16px; --shadow:0 2px 10px rgba(0,0,0,.05);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    font-size:15px;line-height:1.5;padding:0 0 110px}
  .wrap{max-width:560px;margin:0 auto;padding:18px 16px}
  header h1{font-size:21px;margin:0 0 2px}
  header p{margin:0;color:var(--sub);font-size:13px}
  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:16px;margin:14px 0}
  .btn{border:none;border-radius:12px;padding:10px 16px;font-size:14px;font-weight:600;
    cursor:pointer;background:var(--accent);color:#fff;transition:.12s}
  .btn:active{transform:scale(.96)}
  .btn.ghost{background:#fff;color:var(--accent);border:1.5px solid var(--accent)}
  .btn.small{padding:7px 12px;font-size:13px}
  .btn.block{width:100%}

  .userbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .userbar .u{font-size:16px;font-weight:700}
  .userbar .u small{font-weight:400;color:var(--sub);margin-left:6px}
  .status{font-size:12px;color:var(--sub)}
  .status.on{color:var(--accent)}

  .btns{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .cnt{position:relative;border-radius:16px;padding:18px 12px 14px;text-align:center;
    color:#fff;cursor:pointer;user-select:none;box-shadow:var(--shadow);transition:.1s;overflow:hidden}
  .cnt:active{transform:scale(.95);filter:brightness(1.05)}
  .cnt .em{font-size:34px;line-height:1}
  .cnt .nm{font-size:15px;font-weight:700;margin-top:6px}
  .cnt .num{font-size:30px;font-weight:800;margin-top:6px}
  .cnt .del{position:absolute;top:6px;right:8px;font-size:14px;opacity:.85;
    background:rgba(0,0,0,.18);border-radius:50%;width:22px;height:22px;line-height:22px}
  .cnt .del:active{background:rgba(0,0,0,.35)}

  .undo{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);
    display:none;align-items:center;gap:12px;background:#2c2a26;color:#fff;
    padding:10px 16px;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:60}
  .undo button{background:#fff;color:#2c2a26;border:none;border-radius:999px;
    padding:7px 14px;font-weight:700;cursor:pointer;font-size:13px}
  .undo .cd{font-variant-numeric:tabular-nums;opacity:.8;font-size:13px}

  .summary .row{display:flex;align-items:center;gap:10px;margin:8px 0}
  .summary .row .lab{width:84px;font-size:13px;display:flex;align-items:center;gap:5px}
  .summary .bar{flex:1;height:14px;background:var(--bg);border-radius:999px;overflow:hidden}
  .summary .bar i{display:block;height:100%;border-radius:999px}
  .summary .row .v{width:42px;text-align:right;font-weight:700;font-size:13px}

  .section-title{font-size:14px;font-weight:700;margin:6px 2px 0}
  footer{text-align:center;color:var(--sub);font-size:11px;margin-top:18px;line-height:1.6}

  .mask{position:fixed;inset:0;background:rgba(20,18,15,.45);display:none;
    align-items:flex-end;justify-content:center;z-index:70}
  .mask.show{display:flex}
  .sheet{background:var(--bg);width:100%;max-width:560px;max-height:88vh;border-radius:20px 20px 0 0;
    overflow:auto;padding:16px 16px 24px;animation:up .2s ease}
  @keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
  .sheet h2{margin:4px 0 12px;font-size:18px}
  .search{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;
    font-size:15px;margin-bottom:12px;background:#fff;outline:none}
  .ppl{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
  .ppl .p{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:9px 14px;
    font-size:14px;cursor:pointer}
  .ppl .p.cur{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}
  .sw{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
  .sw i{width:30px;height:30px;border-radius:50%;cursor:pointer;border:3px solid transparent}
  .sw i.sel{border-color:var(--ink)}
  .toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:#2c2a26;color:#fff;
    padding:10px 18px;border-radius:999px;font-size:13px;opacity:0;transition:.25s;z-index:99;pointer-events:none}
  .toast.show{opacity:1}

  /* 弹幕区 */
  .dm-card{margin-top:12px}
  .danmaku{position:relative;height:150px;overflow:hidden;border-radius:12px;
    background:linear-gradient(120deg,#d9f5dd,#bfe9c8);}
  .dm{position:absolute;left:100%;white-space:nowrap;font-size:15px;font-weight:700;
    color:#1f5e3a;padding:6px 14px;background:rgba(255,255,255,.85);border-radius:999px;
    backdrop-filter:blur(2px);animation:fly linear forwards;will-change:transform}
  .danmaku.has-bg .dm{color:#fff;background:rgba(255,255,255,.16)}
  @keyframes fly{from{transform:translateX(0)}to{transform:translateX(-110vw)}}
  .dm-bar{display:flex;gap:8px;margin-top:10px}
  .dm-card{position:relative}
  .dm-bg-btn{position:absolute;top:10px;right:10px;z-index:5;background:rgba(0,0,0,.4);
    color:#fff;border:none;border-radius:999px;padding:5px 11px;font-size:12px;cursor:pointer}
  .dm-bg-btn:active{transform:scale(.95)}
  .bg-tip{position:absolute;left:10px;bottom:8px;z-index:5;color:#fff;font-size:11px;
    background:rgba(0,0,0,.35);padding:2px 8px;border-radius:999px}
  .dm-bar input{flex:1;border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;
    font-size:14px;background:#fff;outline:none}
  .dm-color-row{display:flex;align-items:center;gap:8px;margin-top:10px}
  .dm-color-lab{font-size:12px;color:var(--sub);white-space:nowrap}
  .sw.mini i{width:20px;height:20px}
  .hist-list{max-height:60vh;overflow:auto}
  .hist-item{display:flex;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);font-size:14px}
  .hist-item .t{color:var(--sub);font-size:12px;white-space:nowrap;width:54px}
  .hist-item .u{color:var(--accent);font-weight:700;white-space:nowrap}
  .hist-item .x{flex:1;word-break:break-word}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>忍住不要工作之忍不住也要忍</h1>
    <p>日常计数器 · 云同步版 ｜ 喝水 · 拉屎 · 叹气，一按就记 · 朋友手机实时同步</p>
  </header>

  <div class="card dm-card">
    <div class="danmaku" id="dmLayer"></div>
    <button class="dm-bg-btn" id="bgBtn">🖼 背景</button>
    <div class="bg-tip" id="bgTip" style="display:none"></div>
    <input type="file" id="bgFile" accept="image/*" style="display:none">
    <div class="dm-bar">
      <input id="dmInput" placeholder="发条弹幕飘一下…（回车发送）" maxlength="200">
      <button class="btn small" id="dmSend">发送</button>
      <button class="btn ghost small" id="dmHistory">📜 历史</button>
    </div>
    <div class="dm-color-row">
      <span class="dm-color-lab">我的弹幕色</span>
      <div class="sw mini" id="dmColorSw"></div>
    </div>
  </div>

  <div class="card userbar">
    <div>
      <div class="u" id="uName">未登录</div>
      <div class="status" id="status">连接中…</div>
    </div>
    <button class="btn small" id="switchBtn">登录 / 切换</button>
  </div>

  <div class="section-title">今天 · 点一下 +1</div>
  <div class="card"><div class="btns" id="btns"></div></div>

  <div class="card" style="text-align:center">
    <button class="btn ghost block" id="newBtn">＋ 新建一个按钮</button>
  </div>

  <div class="section-title">👥 大家今天</div>
  <div class="card" id="compare"></div>

  <div class="section-title">最近 7 天合计</div>
  <div class="card summary" id="summary"></div>

  <footer>
    这是特批联网的云同步版：你和朋友的计数实时存在 Supabase 上（数据可外传）。<br>
    原离线版（数据不出本机）仍保留在 daily-counts.html。
  </footer>
</div>

<div class="undo" id="undoBar">
  <span class="cd" id="undoCd">5s</span>
  <button id="undoBtn">↩ 撤回</button>
</div>

<!-- 登录/切换 -->
<div class="mask" id="userMask">
  <div class="sheet">
    <h2>登录 / 切换用户</h2>
    <div class="ppl" id="ppl"></div>
    <input class="search" id="newUser" placeholder="输入你的名字，例如：小明">
    <button class="btn block" id="addUser">创建并登录</button>
  </div>
</div>

<!-- 新建按钮 -->
<div class="mask" id="customMask">
  <div class="sheet">
    <h2>新建一个按钮</h2>
    <div style="font-size:13px;color:var(--sub);margin-bottom:6px">名称</div>
    <input class="search" id="cbName" placeholder="例如：打哈欠 / 喝咖啡">
    <div style="font-size:13px;color:var(--sub);margin:8px 0 4px">选个图标（可空）</div>
    <div class="sw" id="cbEmoji"></div>
    <div style="font-size:13px;color:var(--sub);margin:8px 0 4px">选个颜色</div>
    <div class="sw" id="cbColor"></div>
    <div style="display:flex;gap:10px;margin-top:16px">
      <button class="btn ghost block" id="cbCancel">取消</button>
      <button class="btn block" id="cbSave">添加</button>
    </div>
  </div>
</div>

<!-- 弹幕历史 -->
<div class="mask" id="histMask">
  <div class="sheet">
    <h2>弹幕历史（全部）</h2>
    <div class="hist-list" id="histList"></div>
    <button class="btn block" id="histClose" style="margin-top:14px">关闭</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ===================== Supabase 配置（改成你自己的） ===================== */
const SUPABASE_URL = "https://sshvcsyfrhpitcfkyvnc.supabase.co";
const SUPABASE_ANON = "sb_publishable_RVgtA2VI3Tasxh3WoHNGMA_VTN1zPlC";
const ROOM = 1; // 单一共享房间，所有人共用一份数据
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
/* ====================================================================== */

const PALETTE=["#4aa3df","#c08457","#e0a458","#3a9d8e","#9b7ede","#e06b8a","#6bbf73","#d98a3d"];
const EMOJIS=["💧","🚽","😮‍💨","☕","🥱","🍎","🚬","🏃","😴","📱","🍜","💪","🌿","🔥","😂","🤧"];
const DM_COLORS=["#e74c3c","#e67e22","#f1c40f","#27ae60","#16a085","#2980b9","#8e44ad","#e84393","#d35400","#2c3e50","#00b894","#fd79a8"];
let myDmColor=null;
function dmColorFor(name){let h=0;for(const c of (name||""))h=(h*31+c.charCodeAt(0))>>>0;return DM_COLORS[h%DM_COLORS.length];}
function isLight(hex){const c=String(hex||"").replace("#","");if(c.length<6)return false;const r=parseInt(c.substr(0,2),16),g=parseInt(c.substr(2,2),16),b=parseInt(c.substr(4,2),16);const L=(0.299*r+0.587*g+0.114*b)/255;return L>0.7;}

function defaultButtons(){return [
  {id:"water",name:"喝水",emoji:"💧",color:"#4aa3df"},
  {id:"poop", name:"拉屎",emoji:"🚽",color:"#c08457"},
  {id:"sigh", name:"叹气",emoji:"😮‍💨",color:"#e0a458"},
  {id:"noot", name:"忍住没加班",emoji:"💪",color:"#3a9d8e"}
];}

let STATE={profiles:{},danmaku:[],bg:null};
let current=localStorage.getItem('dc_user')||null;
let lastBtn=null,undoTimer=null,undoLeft=0;
let cbEmoji="",cbColor=PALETTE[0];

function $(id){return document.getElementById(id)}
function todayStr(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function addDays(s,n){const d=new Date(s+"T00:00:00");d.setDate(d.getDate()+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),1800)}
function esc(s){return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
function profile(){return STATE.profiles[current]}
function genId(){return 'd'+Date.now().toString(36)+Math.random().toString(36).slice(2,5)}

/* 把本地 STATE 写回 Supabase（整行覆盖） */
async function saveState(){ try{ await sb.from('state').upsert({id:ROOM,data:STATE,updated_at:new Date().toISOString()}); }catch(e){console.warn(e)} }

/* 确保某用户存在，并补齐默认按钮 / 迁移 noot */
function ensureProfile(name){
  if(!STATE.profiles[name]){ STATE.profiles[name]={buttons:defaultButtons(),days:{}}; return; }
  if(!STATE.profiles[name].buttons.find(b=>b.id==="noot")){
    STATE.profiles[name].buttons.push({id:"noot",name:"忍住没加班",emoji:"💪",color:"#3a9d8e"});
  }
}

/* 渲染 */
function render(){renderUser();renderButtons();renderSummary();renderCompare();}
function renderUser(){
  $("uName").innerHTML=current?`${current} <small>当前用户</small>`:"未登录";
  renderPeople();renderDmColorPicker();
}
function renderPeople(){
  const box=$("ppl");box.innerHTML="";
  const names=Object.keys(STATE.profiles);
  if(!names.length){box.innerHTML=`<div style="color:var(--sub);font-size:13px">还没有用户，下面创建一个吧</div>`;return}
  names.forEach(n=>{const d=document.createElement("div");d.className="p"+(n===current?" cur":"");
    d.textContent=n;d.onclick=()=>login(n);box.appendChild(d);});
}
function renderButtons(){
  const box=$("btns");box.innerHTML="";
  if(!current){box.innerHTML=`<div style="grid-column:1/-1;text-align:center;color:var(--sub);padding:14px">请先点右上角「登录 / 切换」创建你的名字</div>`;return}
  const p=profile();if(!p){box.innerHTML=`<div style="grid-column:1/-1;text-align:center;color:var(--sub);padding:14px">正在同步你的数据…</div>`;return}
  const day=todayStr();
  p.buttons.forEach(b=>{
    const cnt=(p.days[day]&&p.days[day][b.id])||0;
    const d=document.createElement("div");d.className="cnt";d.style.background=b.color;
    const isDef=["water","poop","sigh","noot"].includes(b.id);
    d.innerHTML=`${!isDef?`<div class="del" data-id="${b.id}">×</div>`:""}
      <div class="em">${b.emoji||"⚪"}</div><div class="nm">${esc(b.name)}</div><div class="num">${cnt}</div>`;
    d.onclick=(e)=>{if(e.target.classList.contains("del"))return;press(b.id)};
    if(!isDef){d.querySelector(".del").onclick=(e)=>{e.stopPropagation();delBtn(b.id)};}
    box.appendChild(d);
  });
}
function press(btnId){if(!current){toast("请先登录");$("switchBtn").click();return;}
  lastBtn=btnId;const p=profile();const day=todayStr();
  if(!p.days[day])p.days[day]={};
  p.days[day][btnId]=(p.days[day][btnId]||0)+1;
  saveState();showUndo();}
function undo(btnId){if(!current)return;const p=profile();const d=p.days[todayStr()];
  if(d&&d[btnId]>0){d[btnId]--;if(d[btnId]<=0)delete d[btnId];saveState();}}
function delBtn(id){if(!confirm("删除这个自定义按钮？历史记录也会一起删。"))return;
  const p=profile();p.buttons=p.buttons.filter(x=>x.id!==id);
  for(const k in p.days)delete p.days[k][id];
  saveState();toast("已删除");}

function showUndo(){undoLeft=5;$("undoCd").textContent=undoLeft+"s";$("undoBar").style.display="flex";
  clearInterval(undoTimer);undoTimer=setInterval(()=>{undoLeft--;if(undoLeft<=0)hideUndo();else $("undoCd").textContent=undoLeft+"s";},1000);}
function hideUndo(){clearInterval(undoTimer);$("undoBar").style.display="none";lastBtn=null;}
function doUndo(){if(!lastBtn)return;undo(lastBtn);hideUndo();toast("已撤回");}
$("undoBtn").onclick=doUndo;

function renderSummary(){
  const el=$("summary");
  if(!current||!profile()){el.innerHTML=`<div style="color:var(--sub);font-size:13px">登录后查看</div>`;return;}
  const p=profile();const days=[];for(let i=6;i>=0;i--)days.push(addDays(todayStr(),-i));
  const totals={};let max=0;p.buttons.forEach(b=>totals[b.id]=0);
  days.forEach(dt=>{const d=p.days[dt]||{};p.buttons.forEach(b=>{totals[b.id]+=(d[b.id]||0);if(totals[b.id]>max)max=totals[b.id]})});
  if(max===0){el.innerHTML=`<div style="color:var(--sub);font-size:13px">这 7 天还没记录，点上面的按钮开始吧</div>`;return;}
  el.innerHTML=p.buttons.map(b=>{const v=totals[b.id];const w=max?Math.round(v/max*100):0;
    return `<div class="row"><div class="lab">${b.emoji||"⚪"} ${esc(b.name)}</div>
      <div class="bar"><i style="width:${w}%;background:${b.color}"></i></div><div class="v">${v}</div></div>`;}).join("");
}

/* 大家今天的次数（同时看别人） */
function renderCompare(){
  const el=$("compare");
  const names=Object.keys(STATE.profiles);
  if(!names.length){el.innerHTML=`<div style="color:var(--sub);font-size:13px">登录后这里会显示所有人的次数</div>`;return;}
  if(names.length===1){el.innerHTML=`<div style="color:var(--sub);font-size:13px">目前只有你一个人～ 把地址发给朋友、他们也登录后，就能同场 PK 喝水 / 拉屎 / 叹气了</div>`;return;}
  const day=todayStr();
  const btnMap={};const order=[];const DEF=["water","poop","sigh","noot"];
  DEF.forEach(id=>{for(const n of names){const b=STATE.profiles[n].buttons.find(x=>x.id===id);if(b){btnMap[id]={name:b.name,emoji:b.emoji,color:b.color};order.push(id);break;}}});
  for(const n of names)STATE.profiles[n].buttons.forEach(b=>{if(!btnMap[b.id]){btnMap[b.id]={name:b.name,emoji:b.emoji,color:b.color};order.push(b.id);}});
  if(!order.length){el.innerHTML="";return;}
  const kings={};
  order.forEach(id=>{let mx=0,ks=[];names.forEach(n=>{const c=((STATE.profiles[n].days[day]||{})[id])||0;if(c>mx){mx=c;ks=[n];}else if(c===mx&&c>0){ks.push(n);}});if(mx>0)kings[id]=ks;});
  const parts=order.filter(id=>kings[id]).map(id=>`${btnMap[id].emoji}${btnMap[id].name}王 ${kings[id].join("/")}`);
  const banner=parts.length?`<div style="font-size:13px;font-weight:700;color:var(--accent);margin-bottom:8px">👑 今日之王：${parts.join(" · ")}</div>`:"";
  let html=`<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:13px;min-width:280px">
    <thead><tr><th style="text-align:left;padding:7px 8px;color:var(--sub);font-weight:600;min-width:96px">按钮</th>`;
  names.forEach(n=>{html+=`<th style="padding:7px 8px;color:${n===current?'var(--accent)':'var(--ink)'};font-weight:${n===current?800:600};white-space:nowrap">${esc(n)}${n===current?' <small>(我)</small>':''}</th>`;});
  html+=`</tr></thead><tbody>`;
  order.forEach(id=>{const b=btnMap[id];const isKing=!!kings[id];
    html+=`<tr><td style="padding:7px 8px;white-space:nowrap;border-top:1px solid var(--line)">${b.emoji||"⚪"} ${esc(b.name)}${isKing?' 👑':''}</td>`;
    names.forEach((n,i)=>{const P=STATE.profiles[n];const cnt=((P.days[day]||{})[id])||0;const lead=kings[id]&&kings[id].includes(n);
      html+=`<td data-i="${i}" data-b="${id}" data-c="${cnt}" style="padding:7px 8px;text-align:center;border-top:1px solid var(--line);font-weight:700;color:${lead?'#e0a458':(n===current?'var(--accent)':'var(--ink)')};cursor:pointer">${cnt}${lead?' 👑':''}</td>`;});
    html+=`</tr>`;});
  html+=`</tbody></table></div><div style="font-size:11px;color:var(--sub);margin-top:6px">点任意数字，给 TA 飘一句调侃弹幕 😏</div>`;
  el.innerHTML=banner+html;
}
$("compare").addEventListener("click",e=>{
  const td=e.target.closest("td[data-i]");if(!td)return;
  if(!current){toast("请先登录");$("switchBtn").click();return;}
  const i=+td.getAttribute("data-i");const b=td.getAttribute("data-b");const cnt=td.getAttribute("data-c");
  const u=Object.keys(STATE.profiles)[i];const btnName=(STATE.profiles[u].buttons.find(x=>x.id===b)||{}).name||b;
  const tmpl=[
    `${u} 今天 ${btnName} ${cnt} 次？厉害了`,
    `${u} 今天 ${btnName} 了 ${cnt} 次，身体很诚实`,
    `致敬 ${u} 今天的 ${btnName} 战绩：${cnt} 次`,
    `嘲笑 ${u}：${btnName} ${cnt} 次，哈哈哈`,
    `@${u} 你 ${btnName} ${cnt} 次是想干嘛`
  ];
  pushDanmaku(tmpl[Math.floor(Math.random()*tmpl.length)], myDmColor||dmColorFor(current));
  toast("已飘给 "+u);
});

/* 登录/切换 */
function login(name){current=name;localStorage.setItem('dc_user',name);ensureProfile(name);saveState();renderUser();closeMasks();toast("已切换到 "+name);}
$("switchBtn").onclick=()=>{$("userMask").classList.add("show")};
$("addUser").onclick=()=>{const n=$("newUser").value.trim();if(!n){toast("先写个名字");return}login(n);$("newUser").value="";};
$("newUser").addEventListener("keydown",e=>{if(e.key==="Enter")$("addUser").click()});

/* 新建按钮 */
$("newBtn").onclick=()=>{if(!current){toast("请先登录");$("switchBtn").click();return;}
  cbEmoji="";cbColor=PALETTE[Math.floor(Math.random()*PALETTE.length)];
  $("cbName").value="";renderEmojiPicker();renderColorPicker();$("customMask").classList.add("show");};
function renderEmojiPicker(){const box=$("cbEmoji");box.innerHTML="";
  EMOJIS.forEach(e=>{const i=document.createElement("i");i.textContent=e;i.style.cssText="font-size:20px;display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid var(--line)";
    if(e===cbEmoji)i.style.outline="3px solid var(--accent)";i.onclick=()=>{cbEmoji=e;renderEmojiPicker()};box.appendChild(i)});}
function renderColorPicker(){const box=$("cbColor");box.innerHTML="";
  PALETTE.forEach(c=>{const i=document.createElement("i");i.style.background=c;if(c===cbColor)i.classList.add("sel");i.onclick=()=>{cbColor=c;renderColorPicker()};box.appendChild(i)});}
$("cbCancel").onclick=()=>$("customMask").classList.remove("show");
$("cbSave").onclick=()=>{const n=$("cbName").value.trim();if(!n){toast("先写名称");return}
  ensureProfile(current);profile().buttons.push({id:'b'+genId(),name:n,emoji:cbEmoji,color:cbColor});
  saveState();$("customMask").classList.remove("show");toast("已添加："+n);};

function closeMasks(){document.querySelectorAll(".mask").forEach(m=>m.classList.remove("show"))}
document.querySelectorAll(".mask").forEach(m=>m.addEventListener("click",e=>{if(e.target===m)closeMasks()}));

/* 弹幕 */
let seenDm=new Set();let firstDm=true;
function processDanmaku(){
  const list=STATE.danmaku||[];
  if(firstDm){list.slice(-30).forEach(spawnDM);firstDm=false;return;}
  list.forEach(d=>{if(!seenDm.has(d.id))spawnDM(d);});
}
function spawnDM(d){
  if(seenDm.has(d.id))return;seenDm.add(d.id);
  const layer=$("dmLayer");const el=document.createElement("div");el.className="dm";
  el.textContent=(d.user?d.user+"：":"")+d.text;
  const col=d.color||dmColorFor(d.user);
  el.style.background=col;
  el.style.color=isLight(col)?"#222":"#fff";
  el.style.top=(4+Math.random()*110)+"px";
  el.style.animationDuration=(8+Math.random()*4)+"s";
  el.style.animationDelay=(Math.random()*2.5)+"s";
  layer.appendChild(el);
  el.addEventListener("animationend",()=>el.remove());
  while(layer.children.length>30)layer.firstChild.remove();
}
function pushDanmaku(text,color){
  if(!current){toast("请先登录");$("switchBtn").click();return;}
  STATE.danmaku=STATE.danmaku||[];
  STATE.danmaku.push({id:genId(),user:current,text,ts:Date.now(),color});
  if(STATE.danmaku.length>1000)STATE.danmaku.shift();
  saveState();
}
function sendDanmaku(){
  const t=$("dmInput").value.trim();if(!t){return}
  if(!current){toast("请先登录");$("switchBtn").click();return}
  pushDanmaku(t, myDmColor||dmColorFor(current));$("dmInput").value="";
}
$("dmSend").onclick=sendDanmaku;
$("dmInput").addEventListener("keydown",e=>{if(e.key==="Enter")sendDanmaku()});
$("dmHistory").onclick=()=>{renderHistory();$("histMask").classList.add("show");};
function renderHistory(){
  const list=(STATE.danmaku||[]).slice().reverse();
  const box=$("histList");
  if(!list.length){box.innerHTML=`<div style="color:var(--sub);font-size:13px;text-align:center;padding:20px">还没有弹幕</div>`;return;}
  box.innerHTML=list.map(d=>{
    const dt=new Date(d.ts);const hh=String(dt.getHours()).padStart(2,'0');const mm=String(dt.getMinutes()).padStart(2,'0');
    const mine=(d.user===current);
    return `<div class="hist-item" data-id="${d.id}" data-mine="${mine}">
      <div class="t">${hh}:${mm}</div><div class="u"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${d.color||dmColorFor(d.user)};margin-right:5px;vertical-align:middle"></span>${esc(d.user||"")}</div>
      <div class="x">${esc(d.text)}${mine?' <span style="color:var(--sub);font-size:11px">· 长按删除</span>':''}</div></div>`;
  }).join("");
  box.querySelectorAll('.hist-item[data-mine="true"]').forEach(el=>{
    bindLongPress(el,()=>deleteDanmaku(el.getAttribute('data-id')));
  });
}
function deleteDanmaku(id){
  if(!confirm("删除这条弹幕？"))return;
  STATE.danmaku=STATE.danmaku.filter(x=>x.id!==id);
  saveState();toast("已删除");
}
function bindLongPress(el,fn){
  let timer=null;
  const start=()=>{timer=setTimeout(()=>{fn();timer=null;},600);};
  const cancel=()=>{if(timer){clearTimeout(timer);timer=null;}};
  el.addEventListener('touchstart',start,{passive:true});
  el.addEventListener('touchend',cancel);
  el.addEventListener('touchmove',cancel);
  el.addEventListener('mousedown',start);
  el.addEventListener('mouseup',cancel);
  el.addEventListener('mouseleave',cancel);
  el.addEventListener('contextmenu',e=>{e.preventDefault();fn();});
}
$("histClose").onclick=()=>$("histMask").classList.remove("show");

/* 弹幕色选择器 */
function renderDmColorPicker(){
  if(!current){myDmColor=null;}
  else{ensureProfile(current);const p=STATE.profiles[current];myDmColor=(p&&p.dmColor)||dmColorFor(current);}
  const box=$("dmColorSw");if(!box)return;box.innerHTML="";
  DM_COLORS.forEach(c=>{const i=document.createElement("i");i.style.background=c;
    if(c===myDmColor)i.classList.add("sel");
    i.onclick=()=>{myDmColor=c;if(current){ensureProfile(current);STATE.profiles[current].dmColor=c;saveState();}renderDmColorPicker();};
    box.appendChild(i);});
}

/* 弹幕背景图 */
function applyBg(){
  const el=$("dmLayer");const b=STATE.bg;const tip=$("bgTip");
  if(b&&b.date===todayStr()){
    el.classList.add("has-bg");
    el.style.backgroundImage='url("'+b.img+'")';
    el.style.backgroundSize="cover";
    el.style.backgroundPosition="center";
    el.style.boxShadow="inset 0 0 0 9999px rgba(0,0,0,.4)";
    tip.style.display="block";tip.textContent="今日背景 · "+b.user+" · 零点重置";
  }else{
    el.classList.remove("has-bg");
    el.style.backgroundImage="";el.style.boxShadow="";
    tip.style.display="none";
  }
}
function compressImg(file,maxW=1200,q=0.72){return new Promise((res,rej)=>{
  const r=new FileReader();r.onload=e=>{const im=new Image();
    im.onload=()=>{let w=im.width,h=im.height;if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}
      const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(im,0,0,w,h);res(c.toDataURL("image/jpeg",q));};
    im.onerror=rej;im.src=e.target.result;};r.onerror=rej;r.readAsDataURL(file);});}
$("bgBtn").onclick=()=>{if(!current){toast("请先登录");$("switchBtn").click();return;}$("bgFile").click();};
$("bgFile").onchange=async e=>{const f=e.target.files[0];if(!f)return;
  const b=STATE.bg;if(b&&b.date===todayStr()){toast("今天已经有人上传过背景啦，零点后再试");e.target.value="";return;}
  toast("压缩中…");const img=await compressImg(f);
  STATE.bg={date:todayStr(),img,user:current};saveState();toast("今日背景已设置");
  e.target.value="";};

/* 启动：拉取数据 + 轮询模式（不依赖 WebSocket，抗网络拦截） */
async function boot(){
  render(); // 先画一帧
  const setStatus=(on,msg)=>{const s=$("status");if(!s)return;s.textContent=msg;s.classList.toggle("on",on);};
  try{
    const {data,error}=await sb.from('state').select('data').eq('id',ROOM).single();
    if(data&&data.data){STATE=data.data;setStatus(true,"已连接 · 实时同步（轮询 3s）");}
    else{STATE={profiles:{},danmaku:[],bg:null};await sb.from('state').upsert({id:ROOM,data:STATE,updated_at:new Date().toISOString()});setStatus(true,"已连接 · 实时同步（轮询 3s）");}
    if(current){ensureProfile(current);await saveState();}
    render();processDanmaku();applyBg();
  }catch(e){console.warn(e);setStatus(false,"连接断开，重连中…");}

  // 轮询：每 3 秒拉取最新一份状态，各端最终一致（不依赖实时推送）
  setInterval(async ()=>{
    try{
      const {data,error}=await sb.from('state').select('data').eq('id',ROOM).single();
      if(data&&data.data){
        STATE=data.data;
        render();processDanmaku();applyBg();
        if($("histMask").classList.contains("show"))renderHistory();
        setStatus(true,"已连接 · 实时同步（轮询 3s）");
      }
    }catch(e){setStatus(false,"连接断开，重连中…");}
  },3000);
}
boot();
</script>
